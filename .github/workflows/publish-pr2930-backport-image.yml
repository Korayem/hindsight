name: Publish PR 2930 backport image

on:
  push:
    branches:
      - backport/hindsight-0.8.5-pr2930
    paths:
      - .github/workflows/publish-pr2930-backport-image.yml
      - docker/standalone/Dockerfile
      - hindsight-api/**
      - hindsight-api-slim/**
      - hindsight-clients/python/**

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-pr2930-backport-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the patched API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/standalone/Dockerfile
          target: api-only
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/korayem/hindsight-api:0.8.5-pr2930.1
          labels: |
            org.opencontainers.image.source=https://github.com/Korayem/hindsight
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.8.5-pr2930.1
